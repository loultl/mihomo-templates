rules:
  # DNS HIJACK
  - DST-PORT,53,DNS-OUT

  # Локальную сеть в директ
  - RULE-SET,geoip-private,🇷🇺 Без VPN,no-resolve
  - RULE-SET,geosite-private,🇷🇺 Без VPN

  # ВПН и всякие Anydesk, Rustdesk, Teamviewer в директ (опционально)
  - PROCESS-NAME-REGEX,(?i).*tailscale.*,🇷🇺 Без VPN
  - PROCESS-NAME-REGEX,(?i).*wireguard.*,🇷🇺 Без VPN
  - PROCESS-NAME-REGEX,(?i).*netbird.*,🇷🇺 Без VPN
  - PROCESS-NAME-REGEX,(?i).*anydesk.*,🇷🇺 Без VPN
  - PROCESS-NAME-REGEX,(?i).*rustdesk.*,🇷🇺 Без VPN
  - PROCESS-NAME-REGEX,(?i).*teamviewer.*,🇷🇺 Без VPN
  - RULE-SET,remote-control,🇷🇺 Без VPN

  # Отправляем торренты в 🇷🇺 Без VPN (опционально)
  - RULE-SET,torrent-clients,🇷🇺 Без VPN
  - RULE-SET,torrent-trackers,🇷🇺 Без VPN
  - PROCESS-NAME-REGEX,(?i).*torrent.*,🇷🇺 Без VPN
  
  # Списки РУ приложений от Legiz
  - AND,((RULE-SET,ru-apps),(RULE-SET,geosite-wl)),⚪🔵🔴 RU сайты
  - AND,((RULE-SET,ru-apps),(RULE-SET,geoip-for-wl)),⚪🔵🔴 RU сайты
  - RULE-SET,ru-apps,⚪🔵🔴 RU сайты

  # Делаем REJECT QUIC
  #- RULE-SET,quic,REJECT
  
  # Общая категория игр
  - RULE-SET,steam,🎮 Игры + Steam
  - RULE-SET,riot,🎮 Игры + Steam
  - RULE-SET,games,🎮 Игры + Steam 
  - PROCESS-NAME-REGEX,(?i).*rocketleague.*,🎮 Игры + Steam
  - PROCESS-NAME,VALORANT-Win64-Shipping.exe,🎮 Игры + Steam
  - PROCESS-NAME,RiotClientServices.exe,🎮 Игры + Steam
  - PROCESS-NAME,vgc.exe,🎮 Игры + Steam
  - PROCESS-NAME,LeagueClient.exe,🎮 Игры + Steam
  - PROCESS-NAME,League of Legends.exe,🎮 Игры + Steam
  - PROCESS-NAME-REGEX,(?i).*valorant.*,🎮 Игры + Steam
  - PROCESS-NAME-REGEX,(?i).*riotclient.*,🎮 Игры + Steam
  - PROCESS-NAME-REGEX,(?i).*vgc.*,🎮 Игры + Steam

  # Определялки IP пускаем в прокси, чтобы пользователь видел, FlClashX
  - DOMAIN,flclashx.app,🚫 Недоступные сайты
  - DOMAIN,ip-api.com,🚫 Недоступные сайты
  - DOMAIN,ipinfo.io,🚫 Недоступные сайты
  - DOMAIN,api.ipquery.io,🚫 Недоступные сайты 
  - DOMAIN,api.seeip.org,🚫 Недоступные сайты
  - DOMAIN,ident.me,🚫 Недоступные сайты
  
  # Определялки IP пускаем в прокси, чтобы пользователь видел, остальное
  - DOMAIN,ipwho.is,🚫 Недоступные сайты
  - DOMAIN,api.myip.com,🚫 Недоступные сайты
  - DOMAIN,ipapi.co,🚫 Недоступные сайты
  - DOMAIN-SUFFIX,ip.sb,🚫 Недоступные сайты
  - DOMAIN,2ip.io,🚫 Недоступные сайты
  - DOMAIN,2ipcore.com,🚫 Недоступные сайты

  # ▶️ YouTube
  - RULE-SET,youtube,▶️ YouTube
  - PROCESS-NAME-REGEX,(?i).*youtube.*,▶️ YouTube
  
  # БС в директ
  - RULE-SET,geoip-for-wl,⚪🔵🔴 RU сайты
  - RULE-SET,geosite-wl,⚪🔵🔴 RU сайты

  # geosite-ru включает в себя и собирается автоматически тут (https://github.com/Davoyan/mihomo-rule-sets) -
  # Подробнее о том, из чего формируются списки, читайте в readme https://github.com/Davoyan/mihomo-rule-sets
  - RULE-SET,geosite-ru,⚪🔵🔴 RU сайты

  # geo-ip-for-ru (https://github.com/Davoyan/mihomo-rule-sets/tree/main/ip-for-ru/lists)
  # Подробнее о том, из чего формируются списки, читайте в readme https://github.com/Davoyan/mihomo-rule-sets
  - RULE-SET,geoip-for-ru,⚪🔵🔴 RU сайты

  # 💬 Discord
  - AND,((RULE-SET,cloudflare-ips),(NETWORK,udp),(DST-PORT,19200-19500)),💬 Discord
  - AND,((RULE-SET,cloudflare-ips),(NETWORK,udp),(DST-PORT,50000-50100)),💬 Discord
  - AND,((RULE-SET,discord_voiceips),(NETWORK,udp),(DST-PORT,50000-50100)),💬 Discord
  - RULE-SET,discord_vc,💬 Discord
  - RULE-SET,discord_domains,💬 Discord
  - PROCESS-NAME-REGEX,(?i).*discord.*,💬 Discord
  - PROCESS-NAME-REGEX,(?i).*vesktop.*,💬 Discord
  
  # ➤ Telegram
  - RULE-SET,telegram-ips,➤ Telegram
  - RULE-SET,telegram-domains,➤ Telegram
  - RULE-SET,additional-telegram-domains,➤ Telegram
  - RULE-SET,additional-telegram-ips,➤ Telegram
  - PROCESS-NAME-REGEX,(?i).*ayugram.*,➤ Telegram
  - PROCESS-NAME-REGEX,(?i).*exteragram.*,➤ Telegram
  - PROCESS-NAME-REGEX,(?i).*telegram.*,➤ Telegram
   
  # Spotify
  - PROCESS-NAME-REGEX,(?i).*spotify.*,Spotify
  - RULE-SET,spotify,Spotify
  
  # Gemini 
  - RULE-SET,gemini,Gemini
  
  # ▶️ Twitch 
  - RULE-SET,twitch-ads,▶️ Twitch
  - RULE-SET,twitch,▶️ Twitch
  
  # 🚫 Недоступные сайты
  - RULE-SET,ru-inside,🚫 Недоступные сайты # ITDog списки доменов недоступные из РФ
  - RULE-SET,refilter_domains,🚫 Недоступные сайты # Re:Filter списки доменов недоступные из РФ
  - RULE-SET,ru-inline-banned,🚫 Недоступные сайты # Домены набитые вручную (смотрите выше)
  - RULE-SET,inline-blocked-ips,🚫 Недоступные сайты # IP набитые вручную (смотрите выше)
  - RULE-SET,category-porn,🚫 Недоступные сайты # Опционально
  - RULE-SET,ai,🚫 Недоступные сайты # Нейросети
  - RULE-SET,speedtest-net,🚫 Недоступные сайты # speedtest.net
  - RULE-SET,cloudflare,🚫 Недоступные сайты
  - RULE-SET,akamai,🚫 Недоступные сайты
  - RULE-SET,amazon,🚫 Недоступные сайты
  - RULE-SET,fastly,🚫 Недоступные сайты
  - RULE-SET,datacamp,🚫 Недоступные сайты
  - RULE-SET,oracle,🚫 Недоступные сайты

  # ⚪🔵🔴 RU сайты
  - RULE-SET,ru-inline,⚪🔵🔴 RU сайты # Списки набитые вручную (смотрите выше в rule-providers)
  
  # 🌍 Остальные сайты
  - MATCH,🌍 Остальные сайты