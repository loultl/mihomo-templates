dns:
  enable: true
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  ipv6: false #true - если хотите резолвить в ipv6
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - rule-set:geosite-private
    - "*.lan"
    - "*.msftncsi.com"
    - "stun.*.*.*"
    - "stun.*.*"
    - "time.windows.com"
    - "time.nist.gov"
    - "time.apple.com"
    - "*.openwrt.pool.ntp.org"
    - "pool.ntp.org"
    - "ntp.ubuntu.com"
    - "time1.apple.com"
    - "time2.apple.com"
    - "time3.apple.com"
    - "time4.apple.com"
    - "time5.apple.com"
    - "time6.apple.com"
    - "time7.apple.com"
    - "time1.google.com"
    - "time2.google.com"
    - "time3.google.com"
    - "time4.google.com"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    - "+.xboxlive.com"
    - "*.*.stun.playstation.net"
    - "xbox.*.*.microsoft.com"
    - "*.ipv6.microsoft.com"
    - "speedtest.cros.wr.pvp.net"
  # ----
  # Опционально выбираем DNS сервера - меняйте на ваш вкус.
  default-nameserver:
    # DNS для доменов DNS серверов
    - https://8.8.8.8/dns-query#🇷🇺 Без VPN
    - https://1.1.1.1/dns-query#🇷🇺 Без VPN
    - https://9.9.9.9/dns-query#🇷🇺 Без VPN
  proxy-server-nameserver:
    # DNS для доменов прокси из раздела proxies
    - https://8.8.8.8/dns-query#🇷🇺 Без VPN
    - https://1.1.1.1/dns-query#🇷🇺 Без VPN
    - https://9.9.9.9/dns-query#🇷🇺 Без VPN
  direct-nameserver:
    # DNS для сайтов идущих через 🇷🇺 Без VPN
    - https://8.8.8.8/dns-query#🇷🇺 Без VPN
  nameserver:
    # Сервер по умолчанию, DNS запросы будут идти через то, что выбрано в "Остальные сайты"
    - https://8.8.8.8/dns-query#🌍 Остальные сайты
    - https://1.1.1.1/dns-query#🌍 Остальные сайты
    - https://9.9.9.9/dns-query#🌍 Остальные сайты
  direct-nameserver-follow-policy: true
  nameserver-policy:
    rule-set:geosite-private:
      - system
    raw.githubusercontent.com,cdn.jsdelivr.net,github.com:
      - https://8.8.8.8/dns-query#🚫 Недоступные сайты
      - https://1.1.1.1/dns-query#🚫 Недоступные сайты
      - https://9.9.9.9/dns-query#🚫 Недоступные сайты
    rule-set:ru-inside,refilter_domains,ru-inline-banned,category-porn,ai,speedtest-net:
      - https://8.8.8.8/dns-query#🚫 Недоступные сайты
      - https://1.1.1.1/dns-query#🚫 Недоступные сайты
      - https://9.9.9.9/dns-query#🚫 Недоступные сайты
    rule-set:youtube:
      - https://8.8.8.8/dns-query#▶️ YouTube
      - https://1.1.1.1/dns-query#▶️ YouTube
      - https://9.9.9.9/dns-query#▶️ YouTube
    rule-set:discord_domains:
      - https://8.8.8.8/dns-query#💬 Discord
      - https://1.1.1.1/dns-query#💬 Discord
      - https://9.9.9.9/dns-query#💬 Discord
    rule-set:telegram-domains,additional-telegram-domains:
      - https://8.8.8.8/dns-query#➤ Telegram
      - https://1.1.1.1/dns-query#➤ Telegram
      - https://9.9.9.9/dns-query#➤ Telegram
    rule-set:spotify:
      - https://8.8.8.8/dns-query#Spotify
      - https://1.1.1.1/dns-query#Spotify
      - https://9.9.9.9/dns-query#Spotify
    rule-set:gemini:
      - https://8.8.8.8/dns-query#Gemini
      - https://1.1.1.1/dns-query#Gemini
      - https://9.9.9.9/dns-query#Gemini
    rule-set:twitch-ads,twitch:
      - https://8.8.8.8/dns-query#▶️ Twitch
      - https://1.1.1.1/dns-query#▶️ Twitch
      - https://9.9.9.9/dns-query#▶️ Twitch
    rule-set:ru-inline,geosite-ru,geosite-wl:
      - https://77.88.8.8/dns-query#⚪🔵🔴 RU сайты
      - https://8.8.8.8/dns-query#⚪🔵🔴 RU сайты

proxies:
  - name: "🇷🇺 Без VPN"
    type: direct
    udp: true
    description: Напрямую, без прокси
  - name: DNS-OUT
    type: dns

proxy-groups:
  - name: 🚫 Недоступные сайты
    icon: https://cdn.jsdelivr.net/gh/remnawave/templates@main/icons/Blocked.png
    type: select
    url: https://www.gstatic.com/generate_204
    ping-config:
      destination: https://speed.cloudflare.com/__down?bytes=51200
      http-method: GET
      interval: 60s
      sampling: 1
      timeout: 3s
      connectivity: http://connectivitycheck.gstatic.com/generate_204
    interval: 1500
    proxies:
      - ⚡️ Smart
      - ⚡️ Авто
      - 🇷🇺 Без VPN # Опционально

  - name: ▶️ YouTube
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png
    type: select
    url: https://www.youtube.com/
    ping-config:
      destination: https://speed.cloudflare.com/__down?bytes=51200
      http-method: GET
      interval: 60s
      sampling: 1
      timeout: 3s
      connectivity: http://connectivitycheck.gstatic.com/generate_204
    tolerance: 8
    interval: 1500
    proxies:
